name: yuraa_app
description: تطبيق يوراء الفائق - Super App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # مشغل الفيديو الحقيقي للشورتس
  video_player: ^2.9.2
  # الكاميرا الحقيقية
  camera: ^0.11.0
  # اختيار فيديو/صورة من الاستوديو
  image_picker: ^1.1.2
  # الترجمة الفورية على الجهاز (بدون إنترنت)
  google_mlkit_translation: ^0.12.0
  # تشفير بصمات كلمات المرور
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
